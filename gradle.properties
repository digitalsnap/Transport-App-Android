org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Full transitive R classes: androidx.startup (pulled in by the Facebook SDK)
# resolves its R$string at runtime, which breaks with non-transitive R classes.
android.nonTransitiveRClass=false
kotlin.code.style=official

# Beta build identity. Bump ridevibe.versionCode for EVERY App Distribution
# upload — duplicates are rejected and testers won't see the new build.
ridevibe.versionCode=1
ridevibe.versionName=1.0.0-beta.1

# Backend wiring — override per build, e.g. -Pridevibe.useMocks=false
# Mocks stay on until the CRS backend lands (roadmap Phase 0).
ridevibe.useMocks=true
ridevibe.apiBaseUrl.debug=http://10.0.2.2:8080/
ridevibe.apiBaseUrl.release=https://api.ridevibe.example.com/
